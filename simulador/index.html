<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Simulador de financiamento da GoiásFomento. Calcula no próprio aparelho, sem servidor.">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#0f3d2e">
<title>Simulador Financeiro — GoiásFomento</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%230f3d2e'/%3E%3Cpath d='M8 22V10h3.4v9.2H18V22H8zm12.6 0V10H24v12h-3.4z' fill='%23fff'/%3E%3C/svg%3E">
<link rel="stylesheet" href="css/app.css">
</head>
<body>

<header class="topo">
  <div class="marca">
    <p class="produto">Simulador Financeiro</p>
    <p class="instituicao">GoiásFomento</p>
  </div>
  <nav class="menu" aria-label="Seções"></nav>
</header>

<p id="erro" class="erro" role="alert" hidden></p>

<main id="conteudo"></main>

<footer class="rodape">
  <p>
    Calculado neste aparelho, sem servidor. Uma simulação não é proposta e não
    vincula a instituição.
  </p>
</footer>

<noscript>
  <p class="erro">
    Este simulador precisa de JavaScript para calcular. Todo o cálculo acontece
    no seu aparelho — nada é enviado para lugar nenhum.
  </p>
</noscript>

<script type="module" src="js/app.js"></script>
</body>
</html>
